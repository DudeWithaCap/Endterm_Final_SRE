version: "3.9"

networks:
  atm-net:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  prometheus_data:
  grafana_data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atm-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - atm-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 128M

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    networks:
      - atm-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M

  auth:
    image: atm-sre/auth:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bankdb
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super-secret-jwt-key-change-in-prod
      JWT_EXPIRE_MINUTES: "60"
    networks:
      - atm-net
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  account:
    image: atm-sre/account:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bankdb
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super-secret-jwt-key-change-in-prod
    networks:
      - atm-net
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  transaction:
    image: atm-sre/transaction:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bankdb
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super-secret-jwt-key-change-in-prod
      HISTORY_SERVICE_URL: http://history:8004
    networks:
      - atm-net
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  history:
    image: atm-sre/history:latest
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: bankdb
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super-secret-jwt-key-change-in-prod
    networks:
      - atm-net
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  card-management:
    image: atm-sre/card-management:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bankdb
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super-secret-jwt-key-change-in-prod
    networks:
      - atm-net
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  gateway:
    image: atm-sre/gateway:latest
    environment:
      AUTH_SERVICE_URL: http://auth:8001
      ACCOUNT_SERVICE_URL: http://account:8002
      TRANSACTION_SERVICE_URL: http://transaction:8003
      HISTORY_SERVICE_URL: http://history:8004
      CARD_SERVICE_URL: http://card-management:8005
    ports:
      - "8000:8000"
    networks:
      - atm-net
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 128M

  background-load:
    image: atm-sre/background-load:latest
    environment:
      GATEWAY_URL: http://gateway:8000
      LOAD_INTERVAL_SECONDS: "5"
      LATENCY_SPIKE_EVERY: "30"
    networks:
      - atm-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          memory: 128M

  frontend:
    image: atm-sre/frontend:latest
    ports:
      - "3000:80"
    networks:
      - atm-net
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 64M

  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_alerts
        target: /etc/prometheus/alert_rules.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - atm-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:10.4.3
    ports:
      - "3009:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - atm-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M

configs:
  prometheus_config:
    file: ../../monitoring/prometheus/prometheus.yml
  prometheus_alerts:
    file: ../../monitoring/prometheus/alert_rules.yml
