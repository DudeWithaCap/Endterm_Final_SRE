apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: atm-banking
data:
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bankdb
  REDIS_URL: redis://redis:6379/0
  JWT_EXPIRE_MINUTES: "60"
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: atm-banking
type: Opaque
stringData:
  JWT_SECRET: super-secret-jwt-key-change-in-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: atm-banking
  labels:
    app: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: atm-sre/auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: auth-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: atm-banking
spec:
  selector:
    app: auth
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
