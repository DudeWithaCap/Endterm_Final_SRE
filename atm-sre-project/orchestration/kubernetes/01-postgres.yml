apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: atm-banking
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: atm-banking
data:
  POSTGRES_DB: bankdb
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: atm-banking
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - configMapRef:
                name: postgres-config
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "bankdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: atm-banking
data:
  01_schema.sql: |
    CREATE TABLE IF NOT EXISTS users (
        id              SERIAL PRIMARY KEY,
        account_number  VARCHAR(20) UNIQUE NOT NULL,
        name            VARCHAR(100) NOT NULL,
        pin_hash        TEXT NOT NULL,
        created_at      TIMESTAMPTZ DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS accounts (
        id              SERIAL PRIMARY KEY,
        user_id         INTEGER NOT NULL REFERENCES users(id),
        account_number  VARCHAR(20) UNIQUE NOT NULL,
        balance         NUMERIC(15, 2) NOT NULL DEFAULT 0.00,
        currency        VARCHAR(3) NOT NULL DEFAULT 'USD',
        created_at      TIMESTAMPTZ DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS transactions (
        id              SERIAL PRIMARY KEY,
        from_account    VARCHAR(20),
        to_account      VARCHAR(20),
        amount          NUMERIC(15, 2) NOT NULL,
        type            VARCHAR(20) NOT NULL,
        status          VARCHAR(20) NOT NULL DEFAULT 'success',
        created_at      TIMESTAMPTZ DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS cards (
        id              SERIAL PRIMARY KEY,
        account_number  VARCHAR(20) NOT NULL REFERENCES accounts(account_number),
        card_number     VARCHAR(19) UNIQUE NOT NULL,
        is_blocked      BOOLEAN NOT NULL DEFAULT FALSE,
        daily_limit     NUMERIC(15, 2) NOT NULL DEFAULT 1000.00,
        created_at      TIMESTAMPTZ DEFAULT NOW()
    );
  02_seed.sql: |
    INSERT INTO users (account_number, name, pin_hash) VALUES
      ('ACC0000001','Alice Johnson','$2b$12$ypN3YBfY2A9PittIn59p2es3yyFJlc.HBj7/Xknp2/kMPQt0oPFfq'),
      ('ACC0000002','Bob Smith','$2b$12$Xy1XyZakkMUw2cQFt29jp.FIMKc6Sx73lFrYjZcF0YRhzlOICX9Su'),
      ('ACC0000003','Charlie Brown','$2b$12$57SwliR5XUjBwDgKZ9m1FeF2NOcLXAD.A2C7ivX81TDTnYXYGPs4O'),
      ('ACC0000004','Diana Prince','$2b$12$S.zks1QXU3uq9gti4WNnvuRwJVtp1lpnprfEsJ5m6h/zrTD05qhzC'),
      ('ACC0000005','Eve Davis','$2b$12$zqoHT6Dj3DYAUDKHvIch0.Hvi2nRFxXMsAS0KzbIhMgX87jZ5EQEa')
    ON CONFLICT (account_number) DO NOTHING;
    INSERT INTO accounts (user_id, account_number, balance, currency) VALUES
      (1,'ACC0000001',5000.00,'USD'),(2,'ACC0000002',12500.50,'USD'),
      (3,'ACC0000003',750.25,'USD'),(4,'ACC0000004',99999.99,'USD'),
      (5,'ACC0000005',200.00,'USD')
