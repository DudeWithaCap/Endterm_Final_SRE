apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: atm-banking
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alert_rules.yml
    scrape_configs:
      - job_name: gateway
        static_configs:
          - targets: ["gateway:8000"]
      - job_name: auth
        static_configs:
          - targets: ["auth:8001"]
      - job_name: account
        static_configs:
          - targets: ["account:8002"]
      - job_name: transaction
        static_configs:
          - targets: ["transaction:8003"]
      - job_name: history
        static_configs:
          - targets: ["history:8004"]
      - job_name: card-management
        static_configs:
          - targets: ["card-management:8005"]
      - job_name: background-load
        static_configs:
          - targets: ["background-load:8006"]
  alert_rules.yml: |
    groups:
      - name: sre_availability
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.job }} is DOWN"
      - name: sre_latency
        rules:
          - alert: HighLatencyTransaction
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="transaction"}[5m])) > 0.2
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High p95 latency on Transaction Service"
          - alert: HighLatencyAccount
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="account"}[5m])) > 0.2
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High p95 latency on Account Service"
      - name: sre_error_rate
        rules:
          - alert: HighErrorRate
            expr: |
              sum by (job)(rate(http_requests_total{status_code=~"5.."}[5m]))
              / sum by (job)(rate(http_requests_total[5m])) > 0.01
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High error rate on {{ $labels.job }}"
      - name: sre_transactions
        rules:
          - alert: LowTransactionSuccessRate
            expr: |
              rate(background_load_ops_total{status="success"}[5m])
              / rate(background_load_ops_total[5m]) < 0.99
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "Transaction success rate below 99% SLO"
          - alert: TransactionServiceNoDB
            expr: |
              rate(http_requests_total{job="transaction",status_code=~"5.."}[2m])
              / rate(http_requests_total{job="transaction"}[2m]) > 0.5
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Transaction Service DB connection failure"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: atm-banking
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: atm-banking
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: atm-banking
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30900
  type: NodePort
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: atm-banking
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: atm-banking
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.3
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: atm-banking
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30309
  type: NodePort
