apiVersion: v1
kind: ConfigMap
metadata:
  name: card-management-config
  namespace: atm-banking
data:
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bankdb
  REDIS_URL: redis://redis:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: card-management
  namespace: atm-banking
  labels:
    app: card-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: card-management
  template:
    metadata:
      labels:
        app: card-management
    spec:
      containers:
        - name: card-management
          image: atm-sre/card-management:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
          envFrom:
            - configMapRef:
                name: card-management-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: card-management
  namespace: atm-banking
spec:
  selector:
    app: card-management
  ports:
    - port: 8005
      targetPort: 8005
  type: ClusterIP
