apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: atm-banking
data:
  AUTH_SERVICE_URL: http://auth:8001
  ACCOUNT_SERVICE_URL: http://account:8002
  TRANSACTION_SERVICE_URL: http://transaction:8003
  HISTORY_SERVICE_URL: http://history:8004
  CARD_SERVICE_URL: http://card-management:8005
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: atm-banking
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: thatonekap/atm-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: gateway-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: atm-banking
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
  type: NodePort
