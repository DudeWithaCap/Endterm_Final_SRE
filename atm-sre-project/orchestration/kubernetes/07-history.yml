apiVersion: v1
kind: ConfigMap
metadata:
  name: history-config
  namespace: atm-banking
data:
  MONGO_URL: mongodb://mongo:27017
  MONGO_DB: bankdb
  REDIS_URL: redis://redis:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: history
  namespace: atm-banking
  labels:
    app: history
spec:
  replicas: 2
  selector:
    matchLabels:
      app: history
  template:
    metadata:
      labels:
        app: history
    spec:
      containers:
        - name: history
          image: atm-sre/history:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: history-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: history
  namespace: atm-banking
spec:
  selector:
    app: history
  ports:
    - port: 8004
      targetPort: 8004
  type: ClusterIP
