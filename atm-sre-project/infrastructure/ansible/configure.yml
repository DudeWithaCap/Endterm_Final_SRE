---
- name: Configure all servers
  hosts: all_servers
  become: true
  tasks:
    - name: Create project directory
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Set system limits for Docker
      blockinfile:
        path: /etc/sysctl.conf
        block: |
          vm.max_map_count=262144
          net.core.somaxconn=65535
          net.ipv4.tcp_max_syn_backlog=65535
        marker: "# {mark} ATM SRE MANAGED"

    - name: Apply sysctl changes
      command: sysctl -p
      changed_when: false

    - name: Configure Docker daemon (log rotation)
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "50m",
              "max-file": "3"
            },
            "metrics-addr": "0.0.0.0:9323",
            "experimental": true
          }
      notify: restart docker

  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted

- name: Configure app server environment
  hosts: app_servers
  become: true
  tasks:
    - name: Clone or update project repository
      git:
        repo: "{{ project_repo }}"
        dest: "{{ project_dir }}"
        version: main
        force: yes
      become_user: ubuntu

    - name: Write .env file for docker-compose
      copy:
        dest: "{{ project_dir }}/.env"
        owner: ubuntu
        mode: "0600"
        content: |
          DATABASE_URL={{ database_url }}
          REDIS_URL={{ redis_url }}
          MONGO_URL={{ mongo_url }}
          JWT_SECRET={{ jwt_secret }}
          HISTORY_SERVICE_URL=http://history:8004
          GATEWAY_URL=http://gateway:8000
          LOAD_INTERVAL_SECONDS=5
          LATENCY_SPIKE_EVERY=30

- name: Configure database server
  hosts: db_servers
  become: true
  tasks:
    - name: Create PostgreSQL data directory
      file:
        path: /data/postgres
        state: directory
        owner: "999"  # postgres container UID
        mode: "0700"

    - name: Create MongoDB data directory
      file:
        path: /data/mongo
        state: directory
        owner: "999"  # mongodb container UID
        mode: "0755"

    - name: Create Redis data directory
      file:
        path: /data/redis
        state: directory
        mode: "0755"
