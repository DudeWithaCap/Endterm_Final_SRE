global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # add alertmanager host here when configured

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8000"]
    metrics_path: /metrics

  - job_name: "auth"
    static_configs:
      - targets: ["auth:8001"]
    metrics_path: /metrics

  - job_name: "account"
    static_configs:
      - targets: ["account:8002"]
    metrics_path: /metrics

  - job_name: "transaction"
    static_configs:
      - targets: ["transaction:8003"]
    metrics_path: /metrics

  - job_name: "history"
    static_configs:
      - targets: ["history:8004"]
    metrics_path: /metrics

  - job_name: "card-management"
    static_configs:
      - targets: ["card-management:8005"]
    metrics_path: /metrics

  - job_name: "background-load"
    static_configs:
      - targets: ["background-load:8006"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
