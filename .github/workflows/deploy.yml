name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push all service images
        working-directory: atm-sre-project
        run: |
          SERVICES=(gateway auth account transaction history card-management background-load frontend)
          for SERVICE in "${SERVICES[@]}"; do
            if [ "$SERVICE" = "frontend" ]; then
              CTX="frontend"
            else
              CTX="services/${SERVICE}"
            fi
            echo "Building ${{ secrets.DOCKER_USERNAME }}/atm-${SERVICE}:latest..."
            docker build -t ${{ secrets.DOCKER_USERNAME }}/atm-${SERVICE}:latest ${CTX}
            docker push ${{ secrets.DOCKER_USERNAME }}/atm-${SERVICE}:latest
          done

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} '
            cd ~/atm-sre-project
            git pull origin main
            sudo kubectl apply -k ~/atm-sre-project/atm-sre-project/orchestration/kubernetes/
            sudo kubectl create secret generic jwt-secret \
              --from-literal=JWT_SECRET=supersecretjwtkey123 \
              --namespace=atm-banking --dry-run=client -o yaml | sudo kubectl apply -f -
            sudo kubectl rollout restart deployment --namespace=atm-banking
          '

  healthcheck:
    name: Health Check All Services
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Wait for all pods to be ready
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} \
            'sudo kubectl wait --for=condition=ready pod --all -n atm-banking --timeout=300s'

      - name: Print pod status
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} \
            'sudo kubectl get pods -n atm-banking'
