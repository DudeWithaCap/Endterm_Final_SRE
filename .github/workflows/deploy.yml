name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push all service images
        working-directory: atm-sre-project
        run: |
          SERVICES=(gateway auth account transaction history card-management background-load frontend)
          for SERVICE in "${SERVICES[@]}"; do
            if [ "$SERVICE" = "frontend" ]; then
              CTX="frontend"
            else
              CTX="services/${SERVICE}"
            fi
            echo "Building ${{ secrets.DOCKER_USERNAME }}/atm-${SERVICE}:latest..."
            docker build -t ${{ secrets.DOCKER_USERNAME }}/atm-${SERVICE}:latest ${CTX}
            docker push ${{ secrets.DOCKER_USERNAME }}/atm-${SERVICE}:latest
          done

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} '
            cd ~/atm-sre-project
            git pull origin main
            cd atm-sre-project/orchestration
            docker compose pull
            docker compose up -d
          '

  healthcheck:
    name: Health Check All Services
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Wait for services to be ready
        run: sleep 300

      - name: Check all service health endpoints
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} '
            FAILED=0

            check() {
              SERVICE=$1
              PORT=$2
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://localhost:${PORT}/health")
              if [ "$HTTP_CODE" -eq 200 ]; then
                echo "✓ ${SERVICE} (port ${PORT}) — OK"
              else
                echo "✗ ${SERVICE} (port ${PORT}) — FAILED (HTTP ${HTTP_CODE})"
                FAILED=1
              fi
            }

            check gateway         8000
            check auth            8001
            check account         8002
            check transaction     8003
            check history         8004
            check card-management 8005
            check background-load 8006

            if [ "$FAILED" -eq 1 ]; then
              echo "Health check failed — one or more services are unhealthy."
              exit 1
            else
              echo "All 7 services are healthy."
            fi
          '
