name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push all service images
        run: |
          SERVICES=(gateway auth account transaction history card-management background-load frontend)
          for SERVICE in "${SERVICES[@]}"; do
            if [ "$SERVICE" = "frontend" ]; then
              CTX="frontend"
            else
              CTX="services/${SERVICE}"
            fi
            echo "Building ${{ secrets.DOCKER_USERNAME }}/atm-${SERVICE}:latest..."
            docker build -t ${{ secrets.DOCKER_USERNAME }}/atm-${SERVICE}:latest ${CTX}
            docker push ${{ secrets.DOCKER_USERNAME }}/atm-${SERVICE}:latest
          done

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add EC2 host to known hosts
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Copy kubeconfig from EC2
        run: |
          mkdir -p ~/.kube
          scp ubuntu@${{ secrets.EC2_HOST }}:~/.kube/config ~/.kube/config
          sed -i "s/127.0.0.1/${{ secrets.EC2_HOST }}/g" ~/.kube/config

      - name: Apply Kubernetes manifests
        run: kubectl apply -k orchestration/kubernetes/

      - name: Restart all deployments to pull latest images
        run: kubectl rollout restart deployment --namespace=atm-banking

      - name: Wait for rollout to complete
        run: kubectl rollout status deployment --namespace=atm-banking --timeout=180s

  healthcheck:
    name: Health Check All Services
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for pods to be ready
        run: sleep 30

      - name: Check all service health endpoints
        run: |
          FAILED=0

          check() {
            SERVICE=$1
            PORT=$2
            URL="http://${{ secrets.EC2_HOST }}:${PORT}/health"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL")
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✓ ${SERVICE} (port ${PORT}) — OK"
            else
              echo "✗ ${SERVICE} (port ${PORT}) — FAILED (HTTP ${HTTP_CODE})"
              FAILED=1
            fi
          }

          check gateway          8000
          check auth             8001
          check account          8002
          check transaction      8003
          check history          8004
          check card-management  8005
          check background-load  8006

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "Health check failed — one or more services are unhealthy."
            exit 1
          else
            echo ""
            echo "All 7 services are healthy."
          fi
